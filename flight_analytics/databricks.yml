# This is a Declarative Automation Bundle definition for flight_analytics.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: flight_analytics
  uuid: 052846cb-3b1d-4472-a99e-fc7f91f29297

include:
  - resources/*.yml
  - resources/*/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    presets:
      name_prefix: dev_${workspace.current_user.short_name}_
      source_linked_deployment: false
    workspace:
      host: https://dbc-4332bc2c-6150.cloud.databricks.com
      root_path: /Workspace/Users/ragesh.narayanan@gmail.com/dev_bundles/${bundle.name}/${bundle.target}
    variables:
      catalog: dev_flight_analytics
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://dbc-4332bc2c-6150.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/ragesh.narayanan@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/ragesh.narayanan@gmail.com/prod_bundles/${bundle.name}/${bundle.target}
    variables:
      catalog: prod_flight_analytics
      schema: prod
    permissions:
      - user_name: admins
        level: CAN_MANAGE
